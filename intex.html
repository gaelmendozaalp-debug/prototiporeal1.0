body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f7f8f6;
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.cl-login10-demo {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  place-items: center;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  box-sizing: border-box;
  padding: 12px;
  background: radial-gradient(40% 50% at 15% 20%, #f3dfe5, transparent 70%),
    radial-gradient(35% 45% at 85% 25%, #e8edf0, transparent 70%),
    radial-gradient(45% 50% at 60% 95%, #e4eee6, transparent 70%),
    #f7f8f6;
}

.cl-login10 {
  --cl-login10-ink: #29342f;
  --cl-login10-muted: #707a74;
  --cl-login10-violet: #e57373;
  --cl-login10-violet-soft: #fff0f0;
  --cl-login10-button-hover: #ef8585;
  --cl-login10-button-edge: #c94f55;
  --cl-login10-error: #a85764;
  width: 100%;
  max-width: 1080px;
  box-sizing: border-box;
  padding: 32px clamp(20px, 6vw, 36px) 24px;
  border: 1px solid rgba(255, 255, 255, .8);
  border-radius: 28px;
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 24px 60px -24px rgba(76, 29, 149, .35);
  color: var(--cl-login10-ink);
  line-height: 1.5;
  transform: scale(var(--login-scale, 1));
  transform-origin: center;
}

.cl-login10 *,
.cl-login10 *::before,
.cl-login10 *::after {
  box-sizing: border-box;
}

.cl-login10 [hidden] {
  display: none !important;
}

.cl-login10__vh {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.cl-login10__head {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 12px;
  align-items: center;
  margin-bottom: 24px;
}

.cl-login10__logo {
  grid-row: span 2;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: transparent;
}

.cl-login10__logo img {
  width: 44px;
  height: 44px;
  object-fit: contain;
}

.cl-login10__brand {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.2;
}

.cl-login10__tagline {
  margin: 0;
  color: var(--cl-login10-muted);
  font-size: 14px;
}

.cl-login10__tabs {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 4px;
  border-radius: 999px;
  background: #f4f4f5;
}

.cl-login10__thumb {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc(50% - 4px);
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 1px 3px rgba(24, 24, 27, .12), 0 4px 10px -4px rgba(76, 29, 149, .25);
  transition: transform .3s cubic-bezier(.3, .7, .2, 1);
}

.cl-login10__tabs.is-second .cl-login10__thumb {
  transform: translateX(100%);
}

.cl-login10__tab {
  position: relative;
  z-index: 1;
  min-height: 42px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--cl-login10-muted);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: color .2s ease;
}

.cl-login10__tab[aria-selected="true"] {
  color: var(--cl-login10-ink);
}

.cl-login10__tab:hover {
  color: var(--cl-login10-ink);
}

.cl-login10__panels {
  overflow: hidden;
  min-height: 470px;
}

.cl-login10__panel {
  min-height: 470px;
  padding-top: 24px;
  border-radius: 12px;
  display: grid;
  grid-template-columns: minmax(250px, .82fr) minmax(0, 1.18fr);
  align-items: center;
  gap: clamp(24px, 4vw, 56px);
}

.cl-login10__panel[hidden] {
  display: none;
}

.cl-login10__art {
  width: min(100%, 320px);
  height: 320px;
  object-fit: contain;
  justify-self: center;
}

.cl-login10__form {
  width: 100%;
  max-width: 500px;
  justify-self: center;
}

.cl-login10__form[data-form="signup"] {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 18px;
}

.cl-login10__form[data-form="signup"] > :is(.cl-login10__title, [data-form-error], .cl-login10__submit, .cl-login10__swap) {
  grid-column: 1 / -1;
}

.cl-login10__form[data-form="signup"] .cl-login10__field {
  min-width: 0;
}

.cl-login10__panel.is-from-right {
  animation: cl-login10-right .42s cubic-bezier(.2, .75, .25, 1) both;
}

.cl-login10__panel.is-from-left {
  animation: cl-login10-left .42s cubic-bezier(.2, .75, .25, 1) both;
}

.cl-login10__panel.is-from-right .cl-login10__art,
.cl-login10__panel.is-from-right .cl-login10__form {
  animation: cl-login10-content-right .55s cubic-bezier(.2, .75, .25, 1) both;
}

.cl-login10__panel.is-from-left .cl-login10__art,
.cl-login10__panel.is-from-left .cl-login10__form {
  animation: cl-login10-content-left .55s cubic-bezier(.2, .75, .25, 1) both;
}

.cl-login10__panel .cl-login10__art {
  animation-delay: .04s;
}

.cl-login10__panel .cl-login10__form {
  animation-delay: .1s;
}

@keyframes cl-login10-right {
  from {
    opacity: 0;
    transform: translateX(40px);
  }
}

@keyframes cl-login10-left {
  from {
    opacity: 0;
    transform: translateX(-40px);
  }
}

@keyframes cl-login10-content-right {
  from {
    opacity: 0;
    transform: translateX(24px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

@keyframes cl-login10-content-left {
  from {
    opacity: 0;
    transform: translateX(-24px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

.cl-login10__title {
  margin: 0 0 18px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.cl-login10__field {
  margin-bottom: 14px;
}

.cl-login10__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.cl-login10__label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
}

.cl-login10__input {
  display: block;
  width: 100%;
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid #d4d4d8;
  border-radius: 14px;
  background: #fff;
  color: var(--cl-login10-ink);
  font: inherit;
  font-size: 15px;
  transition: border-color .15s ease, box-shadow .15s ease;
}

.cl-login10__input:hover {
  border-color: #a1a1aa;
}

.cl-login10__input:focus {
  outline: none;
  border-color: var(--cl-login10-violet);
  box-shadow: 0 0 0 4px rgba(109, 40, 217, .16);
}

.cl-login10__pw {
  position: relative;
}

.cl-login10__pw .cl-login10__input {
  padding-right: 50px;
}

.cl-login10__eye {
  position: absolute;
  top: 4px;
  right: 4px;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--cl-login10-muted);
  cursor: pointer;
}

.cl-login10__eye:hover {
  background: #f4f4f5;
  color: var(--cl-login10-ink);
}

.cl-login10__eye-off,
.cl-login10__eye[aria-pressed="true"] .cl-login10__eye-on {
  display: none;
}

.cl-login10__eye[aria-pressed="true"] .cl-login10__eye-off {
  display: block;
}

.cl-login10__hint {
  margin: 6px 0 0;
  color: var(--cl-login10-muted);
  font-size: 13px;
}

.cl-login10__check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
}

.cl-login10__check input {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--cl-login10-violet);
}

.cl-login10__link {
  color: var(--cl-login10-violet);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  border-radius: 4px;
}

.cl-login10__link:hover {
  text-decoration: underline;
}

.cl-login10__submit {
  width: 100%;
  min-height: 56px;
  margin-top: 6px;
  padding: 14px 28px;
  border: 2px solid var(--cl-login10-button-edge);
  border-radius: 16px;
  background: var(--cl-login10-violet);
  color: #fff;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--cl-login10-button-edge);
  transform: translateY(0);
  transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
}

.cl-login10__submit:hover:not(:disabled) {
  background: var(--cl-login10-button-hover);
  transform: translateY(2px);
  box-shadow: 0 4px 0 var(--cl-login10-button-edge);
}

.cl-login10__submit:active:not(:disabled) {
  transform: translateY(6px);
  box-shadow: 0 0 0 var(--cl-login10-button-edge);
}

.cl-login10__swap {
  margin: 16px 0 0;
  color: var(--cl-login10-muted);
  font-size: 14px;
  text-align: center;
}

.cl-login10__swap-btn {
  padding: 2px 4px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--cl-login10-violet);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.cl-login10__swap-btn:hover {
  text-decoration: underline;
}

.cl-login10__tab:focus-visible,
.cl-login10__panel:focus-visible,
.cl-login10__eye:focus-visible,
.cl-login10__check input:focus-visible,
.cl-login10__link:focus-visible,
.cl-login10__submit:focus-visible,
.cl-login10__swap-btn:focus-visible {
  outline: 3px solid var(--cl-login10-violet);
  outline-offset: 2px;
}

.cl-login10__error {
  margin: 6px 0 0;
  color: var(--cl-login10-error);
  font-size: 13px;
  font-weight: 500;
}

.cl-login10__error:empty {
  display: none;
}

.cl-login10__field.is-error .cl-login10__input {
  border-color: var(--cl-login10-error);
  box-shadow: 0 0 0 3px rgba(190, 18, 60, .12);
}

.cl-login10__done {
  padding: 36px 0 12px;
  text-align: center;
  animation: cl-login10-right .32s ease;
}

.cl-login10__done:focus {
  outline: none;
}

.cl-login10__done:focus-visible {
  outline: 3px solid var(--cl-login10-violet);
  outline-offset: 6px;
  border-radius: 14px;
}

.cl-login10__streak {
  display: inline-flex;
  gap: 6px;
  margin-bottom: 18px;
}

.cl-login10__streak span {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--cl-login10-violet-soft);
}

.cl-login10__streak span:nth-child(-n+5) {
  background: #a78bfa;
}

.cl-login10__streak span:nth-child(5) {
  background: var(--cl-login10-violet);
}

.cl-login10__done .cl-login10__title {
  margin-bottom: 6px;
}

.cl-login10__sub {
  margin: 0 0 18px;
  color: var(--cl-login10-muted);
}

.cl-login10__demo {
  margin: 18px 0 0;
  color: #5f5f68;
  font-size: 12px;
  text-align: center;
}

.cl-login10__demo button {
  display: block;
  width: 100%;
  min-height: 50px;
  margin: 12px 0 0;
  padding: 12px 20px;
  border: 2px solid var(--cl-login10-button-edge);
  border-radius: 16px;
  background: var(--cl-login10-violet);
  color: #fff;
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--cl-login10-button-edge);
  transform: translateY(0);
  transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
}

.cl-login10__demo button:hover:not(:disabled) {
  background: var(--cl-login10-button-hover);
  transform: translateY(2px);
  box-shadow: 0 4px 0 var(--cl-login10-button-edge);
}
.cl-login10__demo button:active:not(:disabled) {
  transform: translateY(6px);
  box-shadow: 0 0 0 var(--cl-login10-button-edge);
}
.cl-login10__demo button:focus-visible { outline: 3px solid var(--cl-login10-violet); outline-offset: 2px; }
.cl-login10__submit:disabled, .cl-login10__demo button:disabled { cursor: wait; opacity: .7; }

@media (max-width: 760px) {
  .cl-login10-demo { align-content: center; padding: 16px 12px; }
  .cl-login10 { max-width: 620px; padding: 24px clamp(18px, 5vw, 32px); }
  .cl-login10__panels, .cl-login10__panel { min-height: 600px; }
  .cl-login10__panel {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .cl-login10__art { width: min(100%, 150px); height: 150px; }
  .cl-login10__form { max-width: 520px; }
}

@media (max-width: 520px) {
  .cl-login10__form[data-form="signup"] { grid-template-columns: 1fr; }
  .cl-login10__form[data-form="signup"] > * { grid-column: 1; }
  .cl-login10__art { width: 120px; height: 120px; }
}

@media (prefers-reduced-motion: reduce) {
  .cl-login10 *,
  .cl-login10 *::before,
  .cl-login10 *::after {
    transition: none !important;
    animation: none !important;
  }
}

.cl-login10__input {
  border: 2px solid #000;
}

.cl-login10__input:hover {
  border-color: #000;
}

.cl-login10__field.is-error .cl-login10__input {
  border-color: var(--cl-login10-error);
}
    </style>

<body>
  <main class="cl-login10-demo">
    <section class="cl-login10" aria-label="Cuenta de SnapDuty">
      <header class="cl-login10__head">
        <span class="cl-login10__logo" aria-hidden="true">
          <img src="/Logo%20de%20SnapDuty.jpg" alt="">
        </span>
        <p class="cl-login10__brand">SnapDuty</p>
        <p class="cl-login10__tagline">Servicio social con propósito</p>
      </header>

      <div class="cl-login10__tabs" role="tablist" aria-label="Iniciar sesión o crear cuenta" data-tablist>
        <span class="cl-login10__thumb" aria-hidden="true"></span>
        <button class="cl-login10__tab" type="button" role="tab" id="cl-login10-tab-login" aria-controls="cl-login10-panel-login" aria-selected="true">Iniciar sesión</button>
        <button class="cl-login10__tab" type="button" role="tab" id="cl-login10-tab-signup" aria-controls="cl-login10-panel-signup" aria-selected="false" tabindex="-1">Crear cuenta</button>
      </div>

      <div class="cl-login10__panels">
        <div class="cl-login10__panel" role="tabpanel" id="cl-login10-panel-login" aria-labelledby="cl-login10-tab-login" tabindex="0">
          <img class="cl-login10__art" src="/Gif%20inicio.gif" alt="Daino animado, mascota de SnapDuty">
          <form class="cl-login10__form" data-form="login" novalidate>
            <h1 class="cl-login10__title">Qué gusto verte</h1>
            <p class="cl-login10__error" data-form-error role="alert"></p>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-l-email">Correo electrónico</label>
              <input class="cl-login10__input" id="cl-login10-l-email" name="email" type="email" autocomplete="username" required data-msg="Escribe tu correo electrónico." aria-describedby="cl-login10-l-email-err">
              <p class="cl-login10__error" id="cl-login10-l-email-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <div class="cl-login10__row">
                <label class="cl-login10__label" for="cl-login10-l-pw">Contraseña</label>
              </div>
              <div class="cl-login10__pw">
                <input class="cl-login10__input" id="cl-login10-l-pw" name="password" type="password" autocomplete="current-password" required data-msg="Escribe tu contraseña." aria-describedby="cl-login10-l-pw-err">
                <button class="cl-login10__eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="cl-login10-l-pw" data-pw-toggle>
                  <svg class="cl-login10__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login10__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login10__error" id="cl-login10-l-pw-err" data-error></p>
            </div>
            <button class="cl-login10__submit" type="submit">Entrar a mi espacio</button>
            <p class="cl-login10__swap">¿Aún no tienes cuenta? <button class="cl-login10__swap-btn" type="button" data-go="signup">Crear cuenta</button></p>
          </form>
        </div>

        <div class="cl-login10__panel" role="tabpanel" id="cl-login10-panel-signup" aria-labelledby="cl-login10-tab-signup" tabindex="0" hidden>
          <img class="cl-login10__art" src="/Daino%20Feliz.png" alt="Daino Feliz, mascota de SnapDuty">
          <form class="cl-login10__form" data-form="signup" novalidate>
            <h2 class="cl-login10__title">Crea tu cuenta</h2>
            <p class="cl-login10__error" data-form-error role="alert"></p>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-name">Nombre completo</label>
              <input class="cl-login10__input" id="cl-login10-s-name" name="name" type="text" autocomplete="name" required minlength="2" data-msg="Escribe tu nombre." aria-describedby="cl-login10-s-name-err">
              <p class="cl-login10__error" id="cl-login10-s-name-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-institution">Institución (opcional)</label>
              <input class="cl-login10__input" id="cl-login10-s-institution" name="institution" type="text" autocomplete="organization">
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-email">Correo electrónico</label>
              <input class="cl-login10__input" id="cl-login10-s-email" name="email" type="email" autocomplete="email" required data-msg="Escribe tu correo electrónico." aria-describedby="cl-login10-s-email-err">
              <p class="cl-login10__error" id="cl-login10-s-email-err" data-error></p>
            </div>
            <div class="cl-login10__field" data-field>
              <label class="cl-login10__label" for="cl-login10-s-pw">Contraseña</label>
              <div class="cl-login10__pw">
                <input class="cl-login10__input" id="cl-login10-s-pw" name="password" type="password" autocomplete="new-password" required minlength="6" data-msg="Usa al menos 6 caracteres." aria-describedby="cl-login10-s-pw-hint cl-login10-s-pw-err">
                <button class="cl-login10__eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="cl-login10-s-pw" data-pw-toggle>
                  <svg class="cl-login10__eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="cl-login10__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
              <p class="cl-login10__hint" id="cl-login10-s-pw-hint">Usa al menos 6 caracteres.</p>
              <p class="cl-login10__error" id="cl-login10-s-pw-err" data-error></p>
            </div>
            <button class="cl-login10__submit" type="submit">Crear cuenta e iniciar</button>
            <p class="cl-login10__swap">¿Ya tienes cuenta? <button class="cl-login10__swap-btn" type="button" data-go="login">Iniciar sesión</button></p>
          </form>
        </div>

        <div class="cl-login10__done" data-success tabindex="-1" hidden>
          <span class="cl-login10__streak" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </span>
          <h2 class="cl-login10__title" data-done-title></h2>
          <p class="cl-login10__sub" data-done-text></p>
          <button class="cl-login10__swap-btn" type="button" data-reset>Back to start</button>
        </div>
      </div>

      <div class="cl-login10__vh" role="status" aria-live="polite" data-live></div>
      <p class="cl-login10__demo">¿Quieres explorar? <button type="button" data-demo>Entrar con cuenta demo</button></p>
    </section>
  </main>
  <script>
    (() => {
      "use strict";

      const TOKEN_KEY = "snapduty_auth_token_v1";
      const USER_KEY = "snapduty_auth_user_v1";
      const tabs = [...document.querySelectorAll("[role='tab']")];
      const tablist = document.querySelector("[data-tablist]");
      const panels = [...document.querySelectorAll("[role='tabpanel']")];
      const liveRegion = document.querySelector("[data-live]");
      const loginCard = document.querySelector(".cl-login10");
      const loginShell = document.querySelector(".cl-login10-demo");

      function fitLoginToViewport() {
        loginShell.style.setProperty("--login-scale", "1");
        const availableWidth = Math.max(1, loginShell.clientWidth - 24);
        const availableHeight = Math.max(1, loginShell.clientHeight - 24);
        const scale = Math.min(1, availableWidth / loginCard.offsetWidth, availableHeight / loginCard.offsetHeight);
        loginShell.style.setProperty("--login-scale", String(scale));
      }

      fitLoginToViewport();
      window.addEventListener("resize", fitLoginToViewport);

      function selectTab(name) {
        const selectedIndex = name === "signup" ? 1 : 0;
        const currentIndex = tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
        if (selectedIndex === currentIndex) return;

        tablist.classList.toggle("is-second", selectedIndex === 1);
        tabs.forEach((tab, index) => {
          const selected = index === selectedIndex;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        panels.forEach((panel, index) => {
          panel.hidden = index !== selectedIndex;
          panel.classList.remove("is-from-right", "is-from-left");
        });
        const direction = selectedIndex > currentIndex ? "is-from-right" : "is-from-left";
        void panels[selectedIndex].offsetWidth;
        panels[selectedIndex].classList.add(direction);
        panels[selectedIndex].querySelector("input")?.focus({ preventScroll: true });
      }

      tabs.forEach((tab, index) => tab.addEventListener("click", () => selectTab(index === 1 ? "signup" : "login")));
      document.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => selectTab(button.dataset.go));
      });
      document.querySelectorAll("[data-pw-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.getAttribute("aria-controls"));
          const visible = input.type === "password";
          input.type = visible ? "text" : "password";
          button.setAttribute("aria-pressed", String(visible));
          button.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
        });
      });

      function clearErrors(form) {
        form.querySelectorAll("[data-error]").forEach((node) => { node.textContent = ""; });
        form.querySelectorAll("[data-field]").forEach((field) => field.classList.remove("is-error"));
        form.querySelector("[data-form-error]").textContent = "";
      }

      function validate(form) {
        clearErrors(form);
        let valid = true;
        form.querySelectorAll("[data-field]").forEach((field) => {
          const input = field.querySelector("input");
          const error = field.querySelector("[data-error]");
          if (!input || input.checkValidity()) return;
          valid = false;
          field.classList.add("is-error");
          if (error) {
            error.textContent = input.validity.typeMismatch
              ? "Escribe un correo válido."
              : input.dataset.msg || "Revisa este campo.";
          }
        });
        if (!valid) form.querySelector(".is-error input")?.focus();
        return valid;
      }

      function showFormError(form, message) {
        form.querySelector("[data-form-error]").textContent = message;
        liveRegion.textContent = message;
      }

      async function sendAuthRequest(form, endpoint, payload, buttonLabel) {
        if (!validate(form)) return;
        const submitButton = form.querySelector("[type='submit']");
        submitButton.disabled = true;
        submitButton.textContent = "Conectando...";
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "No se pudo iniciar sesión.");
          localStorage.setItem(TOKEN_KEY, result.token);
          localStorage.setItem(USER_KEY, JSON.stringify(result.user));
          window.location.replace("/app");
        } catch (error) {
          showFormError(form, error.message || "No se pudo conectar. Inténtalo de nuevo.");
          submitButton.disabled = false;
          submitButton.textContent = buttonLabel;
        }
      }

      document.querySelector("[data-form='login']").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        sendAuthRequest(form, "/api/auth/login", {
          email: form.elements.email.value.trim(),
          password: form.elements.password.value
        }, "Entrar a mi espacio");
      });

      document.querySelector("[data-form='signup']").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        sendAuthRequest(form, "/api/auth/register", {
          name: form.elements.name.value.trim(),
          email: form.elements.email.value.trim(),
          password: form.elements.password.value,
          institution: form.elements.institution.value.trim()
        }, "Crear cuenta e iniciar");
      });

      document.querySelector("[data-demo]").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "Conectando...";
        try {
          const response = await fetch("/api/auth/demo", { method: "POST" });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "No se pudo iniciar la cuenta demo.");
          localStorage.setItem(TOKEN_KEY, result.token);
          localStorage.setItem(USER_KEY, JSON.stringify(result.user));
          window.location.replace("/app");
        } catch (error) {
          document.querySelector("[data-form='login'] [data-form-error]").textContent = error.message;
          liveRegion.textContent = error.message;
          button.disabled = false;
          button.textContent = "Entrar con cuenta demo";
        }
      });

      const loginMessage = new URLSearchParams(window.location.search).get("message");
      if (loginMessage) showFormError(document.querySelector("[data-form='login']"), loginMessage);

      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        fetch("/api/auth/me", { headers: { Authorization: `Bearer ${token}` } })
          .then((response) => {
            if (response.ok) window.location.replace("/app");
            else {
              localStorage.removeItem(TOKEN_KEY);
              localStorage.removeItem(USER_KEY);
            }
          })
          .catch(() => {});
      }
    })();
  </script>
</body>
</html>
